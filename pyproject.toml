[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqtt-client-bench"
version = "0.2.0"
description = "Comparative end-to-end benchmark for popular Python MQTT client libraries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EPL-2.0 OR EDL-1.0" }
authors = [{ name = "MQTT client bench contributors" }]
# The harness itself has no third-party dependency: the orchestrator, the $SYS
# probe and the report are standard library only. Each extra below is one
# system under test, installed in its own environment under .venvs/<extra> by
# `mqtt-client-bench envs --sync`.
dependencies = []

[project.optional-dependencies]
paho = ["paho-mqtt>=2.1.0"]
gmqtt = ["gmqtt>=0.7.0"]
aiomqtt = ["aiomqtt>=2.5.1,<3"]
# Same import name as aiomqtt v2: declared as a conflict below, so it always
# gets an environment of its own.
aiomqtt3 = ["aiomqtt==3.0.0a1"]
amqtt = ["amqtt>=0.12.1"]
awscrt = ["awscrt>=0.37.0"]
zmqtt = ["zmqtt>=0.2.4"]
mqttium = ["mqttium>=1.2.0"]
dev = ["pytest>=7"]

[project.scripts]
mqtt-client-bench = "mqtt_client_bench.run:main"

[tool.uv]
conflicts = [
  [{ extra = "aiomqtt" }, { extra = "aiomqtt3" }],
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/mosquitto",
  "/peer",
  "/tests",
  "/docker-compose.yml",
  "/README.md",
  "/pyproject.toml",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mqtt_client_bench"]
