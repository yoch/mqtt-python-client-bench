name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        # zmqtt and mqttium are experimental (outside [all]) but unit tests cover
        # their adapters, including the private-API shape pins.
        run: pip install -e ".[dev,all,zmqtt,mqttium]"

      - name: Run unit tests
        # Discover instead of maintaining a hand-written module list. The fixed
        # list silently skipped new quality/version_compare test modules.
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
