name: Harness fix source snapshot
on:
  push:
    branches: [work/harness-fix-source-20260910]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7453df65fbdb2c3c684d7ce55d55502b9820b7e2
          persist-credentials: false
      - name: Archive exact base (no benchmarks)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7453df65fbdb2c3c684d7ce55d55502b9820b7e2
          mkdir -p "$RUNNER_TEMP/harness-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/harness-source/base.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/harness-source/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/harness-source/identity.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: harness-source-7453df65
          path: ${{ runner.temp }}/harness-source/
          retention-days: 7
