name: Three-way matched-load ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/mqttium-gmqtt-compare-2e69
    paths:
      - .github/workflows/matched-load-arm64.yml

concurrency:
  group: mqtt-client-bench-matched-load-arm64
  cancel-in-progress: false

jobs:
  matched-load:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Verify ARM64 runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64" || { echo "expected aarch64, got $(uname -m)"; exit 1; }
          python3 --version
          docker --version
          docker compose version
          python3 -m venv --help >/dev/null

      - name: Create isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev,paho,gmqtt,mqttium]"
          pip install --force-reinstall --no-cache-dir \
            "mqttium==1.0.0rc13" \
            "gmqtt==0.7.0" \
            "paho-mqtt==2.1.0"

      - name: Validate harness before measuring
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          PYTHONPATH=src python -m unittest tests.test_unit tests.test_rtt_initiator -v

      - name: Calibrate this ARM64 host as a runner
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          PYTHONPATH=src python -m mqtt_client_bench.run calibrate-host \
            --profile standard \
            --role runner \
            --budget-seconds 300

      - name: Run mqttium / gmqtt / Paho fair comparison
        shell: bash
        env:
          RESULTS_DIR: ${{ runner.temp }}/mqtt-client-bench-arm64
          MATRIX_RUNS: "5"
          MQTTIUM_VER: "1.0.0rc13"
          GMQTT_VER: "0.7.0"
          PAHO_VER: "2.1.0"
        run: |
          set -euo pipefail
          bash scripts/run_mqttium_gmqtt_paho_arm64.sh

      - name: Stop benchmark broker
        if: always()
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then
            . .venv/bin/activate
            PYTHONPATH=src python -m mqtt_client_bench.run broker down || true
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqttium-gmqtt-paho-arm64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mqtt-client-bench-arm64
            hosts/*.json
          if-no-files-found: warn
          retention-days: 14
