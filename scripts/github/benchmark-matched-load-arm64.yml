name: Pairwise native RTT benchmark ARM64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: smoke is non_comparable path proof; aa-validation rechecks A/A only; pacer-causal compares in_loop vs external pacing (no ranking); standard is the official campaign (do not run until A/A is neutral)
        type: choice
        options: [smoke, aa-validation, pacer-causal, standard]
        default: smoke

permissions:
  contents: read

concurrency:
  group: mqttium-benchmark-arm64
  cancel-in-progress: false

jobs:
  benchmark:
    name: pairwise native RTT
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 480
    env:
      BENCH_SHA: db19a075b3ff6a6555027bd3e3fcf94aba26ab30
      MQTTIUM_VER: "1.0.0rc13"
      GMQTT_VER: "0.7.0"
      PAHO_VER: "2.1.0"
      MATRIX_RUNS: "5"
      CAMPAIGN: ${{ github.event.inputs.profile || 'smoke' }}
      PROFILE: smoke
    steps:
      - name: Set run-specific paths
        shell: bash
        run: |
          echo "RESULTS_DIR=$RUNNER_TEMP/mqtt-client-bench-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BENCH_BROKER=127.0.0.1:11883" >> "$GITHUB_ENV"
          if [ "$CAMPAIGN" = "standard" ]; then
            echo "PROFILE=standard" >> "$GITHUB_ENV"
          else
            echo "PROFILE=smoke" >> "$GITHUB_ENV"
          fi
          if [ "$CAMPAIGN" = "smoke" ]; then
            echo "MATRIX_RUNS=1" >> "$GITHUB_ENV"
            echo "RUN_ABBA=1" >> "$GITHUB_ENV"
            echo "RUN_AA=1" >> "$GITHUB_ENV"
            echo "ABBA_BLOCKS=1" >> "$GITHUB_ENV"
            echo "AA_BLOCKS=4" >> "$GITHUB_ENV"
            echo "ABBA_VARIANT_INDEXES=0,1" >> "$GITHUB_ENV"
            echo "AA_VARIANT_INDEXES=0" >> "$GITHUB_ENV"
          elif [ "$CAMPAIGN" = "aa-validation" ]; then
            echo "MATRIX_RUNS=1" >> "$GITHUB_ENV"
            echo "RUN_LOAD_MATRIX=0" >> "$GITHUB_ENV"
            echo "RUN_ABBA=0" >> "$GITHUB_ENV"
            echo "RUN_AA=1" >> "$GITHUB_ENV"
            echo "AA_BLOCKS=4" >> "$GITHUB_ENV"
            echo "AA_VARIANT_INDEXES=0,4" >> "$GITHUB_ENV"
            echo "AA_CONTROL_ENFORCE=1" >> "$GITHUB_ENV"
            echo "RUN_SYNC_REFERENCE_PAIR=0" >> "$GITHUB_ENV"
          elif [ "$CAMPAIGN" = "pacer-causal" ]; then
            echo "MATRIX_RUNS=1" >> "$GITHUB_ENV"
            echo "RUN_LOAD_MATRIX=0" >> "$GITHUB_ENV"
            echo "RUN_ABBA=0" >> "$GITHUB_ENV"
            echo "RUN_AA=1" >> "$GITHUB_ENV"
            echo "AA_BLOCKS=4" >> "$GITHUB_ENV"
            echo "AA_VARIANT_INDEXES=0,4" >> "$GITHUB_ENV"
            echo "AA_CONTROL_ENFORCE=0" >> "$GITHUB_ENV"
            echo "RUN_SYNC_REFERENCE_PAIR=0" >> "$GITHUB_ENV"
          fi

      - name: Checkout exact benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yoch/mqtt-python-client-bench
          ref: db19a075b3ff6a6555027bd3e3fcf94aba26ab30
          path: bench
          persist-credentials: false

      - name: Verify runner and harness provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64" || { echo "expected aarch64, got $(uname -m)"; exit 1; }
          python3 --version
          command -v mosquitto
          command -v taskset
          mosquitto -h 2>&1 | head -n 3
          gov="$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true)"
          echo "governor=$gov"
          if [ "$CAMPAIGN" = "standard" ] && [ "$gov" != "performance" ]; then
            echo "standard campaign requires scaling_governor=performance, got ${gov:-missing}" >&2
            exit 1
          fi
          if pgrep -a mosquitto; then
            echo "A pre-existing Mosquitto process makes the runner unsafe for this benchmark." >&2
            exit 1
          fi
          cd bench
          test "$(git rev-parse HEAD)" = "$BENCH_SHA"
          git status --short

      - name: Create isolated benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev,paho,gmqtt,mqttium]"
          pip install --force-reinstall --no-cache-dir \
            "mqttium==$MQTTIUM_VER" \
            "gmqtt==$GMQTT_VER" \
            "paho-mqtt==$PAHO_VER"
          python - <<'PY'
          from importlib.metadata import version
          assert version("mqttium") == "1.0.0rc13", version("mqttium")
          assert version("gmqtt") == "0.7.0", version("gmqtt")
          assert version("paho-mqtt") == "2.1.0", version("paho-mqtt")
          PY

      - name: Validate pairwise latency invariants
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m unittest -v \
            tests.test_unit.CrossClientLoadTests \
            tests.test_unit.NativeRttDriveTests \
            tests.test_unit.PairwiseCapacityGateTests \
            tests.test_unit.ExternalBrokerTelemetryTests \
            tests.test_unit.RttResponderValidityTests \
            tests.test_unit.MetricsTests.test_application_rtt_compare_uses_latency_p50_lower_is_better \
            tests.test_unit.MetricsTests.test_throughput_compare_still_uses_msgs_per_s \
            tests.test_unit.AbbaCounterbalanceTests \
            tests.test_unit.AaControlGateTests \
            tests.test_unit.CliDefaultsTests.test_compare_cli_accepts_external_broker \
            tests.test_rtt_initiator \
            tests.test_pacing \
            tests.test_temporal_trace

      - name: Calibrate ARM64 host identity and harness cost
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          . .venv/bin/activate
          PYTHONPATH=src python -m mqtt_client_bench.run calibrate-host \
            --profile standard \
            --role runner \
            --skip-ceilings

      - name: Start isolated native Mosquitto
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mosquitto-bench.conf" <<'EOF'
          listener 11883 127.0.0.1
          protocol mqtt
          set_tcp_nodelay true
          allow_anonymous true
          persistence false
          connection_messages false
          log_dest stdout
          log_type error
          sys_interval 1
          max_inflight_messages 1000
          max_queued_messages 10000
          max_packet_size 16777216
          max_keepalive 120
          EOF
          broker_cpuset="$(cd bench && . .venv/bin/activate && PYTHONPATH=src python - <<'PY'
          from mqtt_client_bench.telemetry import allocate_cpuset
          print(allocate_cpuset(["sut", "broker", "loadgen", "orch"], profile="standard")["broker"])
          PY
          )"
          echo "Broker cpuset: $broker_cpuset"
          taskset -c "$broker_cpuset" mosquitto -c "$RUNNER_TEMP/mosquitto-bench.conf" > "$RUNNER_TEMP/mosquitto-bench.log" 2>&1 &
          pid=$!
          echo "BROKER_PID=$pid" >> "$GITHUB_ENV"
          echo "BENCH_BROKER_PID=$pid" >> "$GITHUB_ENV"
          mkdir -p "$RESULTS_DIR"
          echo "$pid" > "$RESULTS_DIR/broker.pid"
          sleep 1
          kill -0 "$pid"
          cat "$RUNNER_TEMP/mosquitto-bench.log"

      - name: Run pairwise native RTT campaign
        shell: bash
        run: |
          set -euo pipefail
          cd bench
          if [ "$CAMPAIGN" = "aa-validation" ]; then
            bash scripts/run_targeted_aa_validation.sh
          elif [ "$CAMPAIGN" = "pacer-causal" ]; then
            bash scripts/run_pacer_causal_aa.sh
          else
            bash scripts/run_pairwise_rtt_campaign.sh
          fi

      - name: Stop native broker
        if: always()
        shell: bash
        run: |
          if [ -n "${BROKER_PID:-}" ]; then
            kill "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

      - name: Upload pairwise-native-rtt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pairwise-native-rtt-${{ env.CAMPAIGN }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}
            bench/hosts/*.json
            ${{ runner.temp }}/mosquitto-bench.conf
            ${{ runner.temp }}/mosquitto-bench.log
          if-no-files-found: warn
          retention-days: 14
