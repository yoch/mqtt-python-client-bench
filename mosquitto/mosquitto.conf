# Benchmark broker. One plaintext listener on loopback; every counter the
# harness reconciles comes from $SYS, published once a second.
listener 11883 127.0.0.1
protocol mqtt
set_tcp_nodelay true

allow_anonymous true
persistence false
connection_messages false
log_dest stdout
log_type error

sys_interval 1

max_inflight_messages 1000
max_queued_messages 10000
max_packet_size 16777216
packet_buffer_size 4096
# The C peer and the $SYS probe connect with keepalive 120 and never 0.
max_keepalive 120

user mosquitto
