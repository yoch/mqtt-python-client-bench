listener 11883 127.0.0.1
protocol mqtt

listener 11884 127.0.0.1
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
use_identity_as_username false
tls_version tlsv1.2

# Nagle + delayed-ACK adds a deterministic ~40 ms/hop to request/response
# traffic; without this the RTT scenarios measure the TCP stack, not the client.
set_tcp_nodelay true

allow_anonymous true
persistence false
connection_messages false
log_dest stdout
log_type error
sys_interval 1

max_inflight_messages 1000
max_queued_messages 10000
# Must exceed the largest benchmark payload (blob8m = 8 MiB) plus MQTT overhead.
# 2.1 defaults to 2_000_000; leave this explicit so blob1m/blob8m still fit.
max_packet_size 16777216
# 2.1 reads a 4 KiB header buffer before parsing Remaining Length (one read
# per packet instead of one read per header byte). Keep the default explicit.
packet_buffer_size 4096
max_keepalive 120
user mosquitto
