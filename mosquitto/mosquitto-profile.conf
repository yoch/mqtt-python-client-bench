# Plaintext-only probe listener. Used by scripts/mosquitto_profile, not by
# the published ranking campaign (that still uses mosquitto.conf + TLS).
listener 11883 127.0.0.1
protocol mqtt

set_tcp_nodelay true
allow_anonymous true
persistence false
connection_messages false
log_dest stdout
log_type error
sys_interval 1

max_inflight_messages 1000
max_queued_messages 10000
max_packet_size 16777216
max_keepalive 120
user mosquitto
