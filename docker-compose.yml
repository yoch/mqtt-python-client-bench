services:
  mosquitto:
    image: ${MQTT_BENCH_MOSQUITTO_IMAGE:-eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408}
    network_mode: host
    user: "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/conf.d:/mosquitto/config/conf.d
      - ./certs:/mosquitto/certs:ro
    restart: "no"
