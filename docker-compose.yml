services:
  mosquitto:
    build:
      context: .
      dockerfile: mosquitto/Dockerfile
    image: mqtt-bench-mosquitto:2.0.20-fast
    network_mode: host
    user: "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
    restart: "no"
